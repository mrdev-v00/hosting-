<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FFA Physics Notes - AKUEB Grade XII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121212;
  --panel: #1e1e1e;
  --panel-hover: #2a2a2a;
  --text: #e0e0e0;
  --text-muted: #a0a0a0;
  --accent: #00b4d8;
  --border: #333333;
  --lime: #2ecc71;
  --magenta: #e74c3c;
  --amber: #f1c40f;
  --font-main: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  font-size: 16px;
  line-height: 1.6;
  padding-bottom: env(safe-area-inset-bottom, 40px);
}

.wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

header {
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 8px 0;
  letter-spacing: -0.5px;
}

.subtitle {
  color: var(--text-muted);
  font-size: 15px;
  margin: 0;
}

/* Progress Bar */
.prog-container {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.prog-text {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  white-space: nowrap;
  font-weight: 700;
}
.bar-container {
  flex: 1;
  height: 6px;
  background: #000;
  border-radius: 3px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: var(--accent);
  width: 0;
  transition: width 0.3s ease;
}

/* Navigation */
nav {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  overflow-x: auto;
  padding-bottom: 8px;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font-main);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s ease;
}
nav button:hover {
  background: var(--panel-hover);
  border-color: var(--accent);
}
nav button.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}

/* SLO Blocks */
.slo-block {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 20px;
  overflow: hidden;
}
.slo-header {
  padding: 16px 20px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(255,255,255,0.02);
  transition: background 0.2s;
}
.slo-header:hover {
  background: rgba(255,255,255,0.05);
}
.slo-header .code {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--magenta);
  font-weight: 700;
}
.slo-header h2 {
  font-size: 16px;
  margin: 0;
  font-weight: 600;
  color: #fff;
}
.slo-content {
  padding: 0 20px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
}
.slo-block.open .slo-content {
  padding: 20px;
  max-height: 5000px;
  border-top: 1px solid var(--border);
}

/* Content Styling */
p { margin-top: 0; margin-bottom: 16px; }
ul, ol { padding-left: 20px; margin-bottom: 16px; }
li { margin-bottom: 6px; }

.highlight-formula {
  background: #000;
  border-left: 4px solid var(--lime);
  padding: 16px;
  border-radius: 4px;
  font-family: var(--font-mono);
  color: var(--lime);
  font-size: 16px;
  text-align: center;
  margin: 20px 0;
  font-weight: 700;
}

.step-box {
  background: rgba(255,255,255,0.03);
  border-left: 2px solid var(--accent);
  padding: 12px 16px;
  margin: 16px 0;
  border-radius: 0 4px 4px 0;
}
.step-box strong { color: var(--accent); }

.warning-box {
  background: rgba(231, 76, 60, 0.1);
  border: 1px solid rgba(231, 76, 60, 0.3);
  padding: 12px 16px;
  border-radius: 4px;
  margin: 16px 0;
  font-size: 14px;
}
.warning-box strong { color: var(--magenta); }

.tip-box {
  background: rgba(241, 196, 15, 0.1);
  border: 1px solid rgba(241, 196, 15, 0.3);
  padding: 12px 16px;
  border-radius: 4px;
  margin: 16px 0;
  font-size: 14px;
}
.tip-box strong { color: var(--amber); }

/* Mark Button */
.mark-btn {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
  transition: all 0.2s;
}
.mark-btn:hover {
  background: var(--accent);
  color: #000;
}
.mark-btn.completed {
  background: var(--lime);
  border-color: var(--lime);
  color: #000;
}

/* Quiz */
.quiz-container {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
}
.quiz-question {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #fff;
}
.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #000;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 18px;
  border-radius: 6px;
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.2s;
}
.option-btn:hover {
  border-color: var(--accent);
}
.option-btn.correct {
  background: rgba(46, 204, 113, 0.15);
  border-color: var(--lime);
  color: var(--lime);
}
.option-btn.wrong {
  background: rgba(231, 76, 60, 0.15);
  border-color: var(--magenta);
  color: var(--magenta);
}
.next-btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
}
.next-btn:hover {
  background: #0096b4;
}
.feedback {
  margin-top: 16px;
  font-size: 14px;
  color: var(--text-muted);
  padding: 12px;
  background: #000;
  border-radius: 6px;
}
</style>
</head>

        </div>
        <div class="step-box">
          <strong>Step 2:</strong> Cancel the mass of the satellite (m) from both sides.<br>

          <strong>Step 2:</strong> At height h: g' = GM / (R+h)²

        <p><strong>Terminal Potential Difference (V):</strong> The potential difference across the external circuit. It is always less than the emf when current is flowing because some energy is lost overcoming internal resistance.</p>
        <div class="highlight-formula">V = ε - I r</div>
        <p>They are equal only when the circuit is open (I = 0).</p>
      `
    },
    {
      code: "13.3.5",
      text: "Derive a relation to understand the effects of internal resistance of a source of e.m.f. on the terminal potential difference",
      content: `
        <p>Consider a cell of emf ε and internal resistance r connected to an external resistance R. Let I be the current in the circuit.</p>
        <div class="step-box">
          <strong>Step 1:</strong> The total resistance of the circuit is R + r.
        </div>
        <div class="step-box">
          <strong>Step 2:</strong> By Ohm's law: I = ε / (R + r)
        </div>
        <div class="step-box">
          <strong>Step 3:</strong> The potential drop across the internal resistance is Ir.
        </div>
        <div class="step-box">
          <strong>Step 4:</strong> The terminal potential difference V is the potential drop across R: V = I R
        </div>
        <div class="step-box">
          <strong>Step 5:</strong> Since ε = I(R + r) = IR + Ir = V + Ir
        </div>
        <div class="step-box">
          <strong>Step 6:</strong> Therefore, <strong>V = ε - I r</strong>
        </div>
        <div class="tip-box">
          <strong>Exam Tip:</strong> This shows that V is less than ε by an amount Ir, which is the voltage drop due to internal resistance.
        </div>
      `
    },
    {
      code: "13.4.1",
      text: "Define electric power",
      content: `
        <p><strong>Electric Power:</strong> The rate at which electrical energy is converted into other forms of energy (like heat or light) in an electric circuit.</p>
        <div class="highlight-formula">P = W / t = I V</div>
        <p>Unit: Watt (W). 1 Watt = 1 Joule/second.</p>
      `
    },
    {
      code: "13.4.2",
      text: "Derive relations for electric power in terms of current (I), voltage (V) and resistance (R)",
      content: `
        <div class="step-box">
          <strong>Step 1:</strong> We know P = I V.
        </div>
        <div class="step-box">
          <strong>Step 2:</strong> By Ohm's law, V = I R. Substitute this into the power equation:<br>
          P = I (I R) = <strong>I² R</strong>
        </div>
        <div class="step-box">
          <strong>Step 3:</strong> Also, from Ohm's law, I = V / R. Substitute this:<br>
          P = (V / R) V = <strong>V² / R</strong>
        </div>
        <div class="tip-box">
          <strong>Exam Tip:</strong> These three formulas (P = IV, P = I²R, P = V²/R) are used depending on which quantities are known.
        </div>
      `
    },
    {
      code: "13.4.3",
      text: "Calculate the power dissipation due to the internal resistance of a circuit",
      content: `
        <p><strong>Question:</strong> A battery of emf 12 V and internal resistance 1 Ω delivers a current of 2 A. Calculate the power lost inside the battery.</p>
        <div class="step-box">
          <strong>Step 1:</strong> P = I² r
        </div>
        <div class="step-box">
          <strong>Step 2:</strong> P = (2)² × 1
        </div>
        <div class="step-box">
          <strong>Step 3:</strong> P = 4 × 1 = <strong>4 W</strong>
        </div>
      `
    },
    {
      code: "13.5.1",
      text: "Explain Kirchhoff's laws",
      content: `
        <p><strong>Kirchhoff's First Law (Junction Rule):</strong> The sum of currents entering a junction is equal to the sum of currents leaving the junction. ΣI_in = ΣI_out.</p>
        <p><strong>Kirchhoff's Second Law (Loop Rule):</strong> The algebraic sum of the changes in potential around any closed loop of a circuit is zero. ΣE = ΣIR.</p>
      `
    },
    {
      code: "13.5.2",
      text: "Explain conservation of charge in a circuit with the help of Kirchhoff's first law",
      content: `
        <p>Kirchhoff's first law is a direct consequence of the conservation of charge. Since charge cannot accumulate at a junction, the total charge entering the junction per unit time must equal the total charge leaving it per unit time. Hence, current in = current out.</p>
      `
    },
    {
      code: "13.5.3",
      text: "Explain conservation of energy in a circuit with the help of Kirchhoff's second law",
      content: `
        <p>Kirchhoff's second law is a consequence of the conservation of energy. As a charge moves around a closed loop, the net work done by the electric field must be zero. The energy gained from the source (emf) must equal the energy lost across the resistors (IR drops). Therefore, ΣE = ΣIR.</p>
      `
    },
    {
      code: "13.5.4",
      text: "Derive a formula for equivalent resistance of two or more resistors using Kirchhoff's law in series and parallel",
      content: `
        <h3>Series Combination</h3>
        <div class="step-box">
          <strong>Step 1:</strong> In series, the same current I flows through both resistors.
        </div>
        <div class="step-box">
          <strong>Step 2:</strong> By Kirchhoff's loop rule: V = V₁ + V₂
        </div>
        <div class="step-box">
          <strong>Step 3:</strong> IR_eq = IR₁ + IR₂
        </div>
        <div class="step-box">
          <strong>Step 4:</strong> Dividing by I: <strong>R_eq = R₁ + R₂</strong>
        </div>
        
        <h3>Parallel Combination</h3>
        <div class="step-box">
          <strong>Step 1:</strong> In parallel, the voltage V is the same across both resistors.
        </div>
        <div class="step-box">
          <strong>Step 2:</strong> By Kirchhoff's junction rule: I = I₁ + I₂
        </div>
        <div class="step-box">
          <strong>Step 3:</strong> V/R_eq = V/R₁ + V/R₂
        </div>
        <div class="step-box">
          <strong>Step 4:</strong> Dividing by V: <strong>1/R_eq = 1/R₁ + 1/R₂</strong>
        </div>
      `
    },
    {
      code: "13.5.5",
      text: "Solve problems using Kirchhoff's laws",
      content: `
        <p><strong>Question:</strong> Two resistors of 6 Ω and 3 Ω are connected in parallel. This combination is connected in series with a 4 Ω resistor and a 12 V battery. Find the total current.</p>
        <div class="step-box">
          <strong>Step 1: Solve parallel part</strong><br>
          1/R_p = 1/6 + 1/3 = 3/6 = 1/2<br>
          R_p = 2 Ω
        </div>
        <div class="step-box">
          <strong>Step 2: Find total resistance</strong><br>
          R_total = R_p + 4 = 2 + 4 = 6 Ω
        </div>
        <div class="step-box">
          <strong>Step 3: Find total current</strong><br>
          I = V / R_total = 12 / 6 = <strong>2 A</strong>
        </div>
      `
    }
  ]
};

// Flatten SLO data for progress tracking
const flatSLOs = Object.values(SLO_DATA).flat();

let completed = {};
try { completed = JSON.parse(localStorage.getItem("ffa_physics_student") || "{}"); } catch(e) {}

function updateProgress() {
  const total = flatSLOs.length;
  const done = Object.keys(completed).filter(k => completed[k]).length;
  document.getElementById("progress-text").textContent = `${done} of ${total} SLOs Done`;
  document.getElementById("progress-bar").style.width = `${(done / total) * 100}%`;
}

function saveProgress() {
  try { localStorage.setItem("ffa_physics_student", JSON.stringify(completed)); } catch(e) {}
}

function renderChapter(ch) {
  const app = document.getElementById("app");
  const data = SLO_DATA[ch];
  
  if (!data) return;

  app.innerHTML = data.map((slo, index) => {
    const id = `${ch}-${index}`;
    const isCompleted = completed[id] ? "completed" : "";
    const btnText = completed[id] ? "✓ Done" : "Mark as Done";
    
    return `
      <div class="slo-block" id="block-${id}">
        <div class="slo-header" onclick="toggleBlock('${id}')">
          <div>
            <span class="code">SLO ${slo.code}</span>
            <h2>${slo.text}</h2>
          </div>
        </div>
        <div class="slo-content">
          ${slo.content}
          <button class="mark-btn ${isCompleted}" onclick="toggleComplete('${id}', event)">${btnText}</button>
        </div>
      </div>
    `;
  }).join("");
}

function toggleBlock(id) {
  const block = document.getElementById(`block-${id}`);
  block.classList.toggle("open");
}

function toggleComplete(id, event) {
  event.stopPropagation();
  const btn = event.target;
  if (completed[id]) {
    delete completed[id];
    btn.classList.remove("completed");
    btn.textContent = "Mark as Done";
  } else {
    completed[id] = true;
    btn.classList.add("completed");
    btn.textContent = "✓ Done";
  }
  saveProgress();
  updateProgress();
}

// Quiz Logic
const QUIZ_DATA = [
  { q: "The distance between two masses doubles. The force becomes:", opts: ["Half", "One quarter", "Double", "Four times"], ans: 1, expl: "F ∝ 1/r², so 1/4." },
  { q: "g at a height equal to Earth's radius above the surface?", opts: ["9.8", "4.9", "2.45", "19.6"], ans: 2, expl: "r = 2R, so g/4 = 2.45 m/s²." },
  { q: "Which is NOT a geostationary condition?", opts: ["T = 24 h", "Above equator", "Same direction as Earth", "Polar orbit"], ans: 3, expl: "A polar orbit cannot stay fixed over one spot." },
  { q: "Force between 2 μC and 3 μC, 30 cm apart:", opts: ["0.6 N", "0.18 N", "6 N", "1.8 N"], ans: 0, expl: "kq₁q₂/r² = 0.054/0.09 = 0.6 N." },
  { q: "Electric field inside a hollow charged spherical shell:", opts: ["kq/r²", "σ/ε₀", "Zero", "Depends on radius"], ans: 2, expl: "Gauss: no enclosed charge, so zero." },
  { q: "6 μF and 3 μF in series:", opts: ["9 μF", "4.5 μF", "2 μF", "18 μF"], ans: 2, expl: "1/C = 1/6 + 1/3 = 1/2." },
  { q: "After t = RC, charge left on a discharging capacitor:", opts: ["50%", "63%", "37%", "0%"], ans: 2, expl: "e⁻¹ ≈ 0.37." },
  { q: "Same wire material, double length, same area. New resistance:", opts: ["R/2", "R", "2R", "4R"], ans: 2, expl: "R ∝ l." },
  { q: "ε = 12 V, r = 1 Ω, R = 5 Ω. Terminal p.d.:", opts: ["12 V", "10 V", "2 V", "6 V"], ans: 1, expl: "I = 2 A, V = 12 − 2 = 10 V." },
  { q: "Kirchhoff's first law expresses conservation of:", opts: ["Energy", "Momentum", "Charge", "Mass"], ans: 2, expl: "Current in = current out at a junction." }
];

let currentQ = 0;
let score = 0;

function renderQuiz() {
  const app = document.getElementById("app");
  if (currentQ >= QUIZ_DATA.length) {
    app.innerHTML = `
      <div class="quiz-container">
        <h2>Quiz Completed</h2>
        <p>Your Score: <strong>${score} / ${QUIZ_DATA.length}</strong></p>
        <p>${score >= 8 ? "Excellent! You are ready for AKUEB board exams." : score >= 5 ? "Good effort. Review the topics you missed." : "Keep studying. Focus on the core concepts."}</p>
        <button class="next-btn" onclick="resetQuiz()">Retry Quiz</button>
      </div>
    `;
    return;
  }

  const q = QUIZ_DATA[currentQ];
  app.innerHTML = `
    <div class="quiz-container">
      <p style="color: var(--text-muted); font-size: 14px;">Question ${currentQ + 1} of ${QUIZ_DATA.length}</p>
      <div class="quiz-question">${q.q}</div>
      ${q.opts.map((opt, i) => `<button class="option-btn" onclick="checkAnswer(${i})">${opt}</button>`).join("")}
      <div class="feedback" id="quiz-feedback"></div>
    </div>
  `;
}

function checkAnswer(selected) {
  const q = QUIZ_DATA[currentQ];
  const btns = document.querySelectorAll(".option-btn");
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add("correct");
    if (i === selected && i !== q.ans) btn.classList.add("wrong");
  });
  
  if (selected === q.ans) score++;
  
  document.getElementById("quiz-feedback").innerHTML = `
    ${q.expl}<br>
    <button class="next-btn" onclick="nextQuestion()">${currentQ + 1 < QUIZ_DATA.length ? "Next Question" : "View Results"}</button>
  `;
}

function nextQuestion() {
  currentQ++;
  renderQuiz();
}

function resetQuiz() {
  currentQ = 0;
  score = 0;
  renderQuiz();
}

// Navigation
document.getElementById("nav").addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") {
    document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    
    const ch = e.target.dataset.ch;
    if (ch === "q") {
      resetQuiz();
    } else {
      renderChapter(ch);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// Initialize
updateProgress();
renderChapter("g");
</script>
